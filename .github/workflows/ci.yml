name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - name: Install (core + test, no PyTorch)
        run: python -m pip install -e ".[test]"
      - name: PyTorch must not be installed
        run: python -c "import importlib.util, sys; sys.exit(1 if importlib.util.find_spec('torch') else 0)"
      - name: Unit tests (no model download)
        run: python -m pytest -q
      - name: Smoke run on the tiny model (ONNX Runtime end to end)
        run: python -m zet.smoke --model tests/fixtures/tiny_model/split --out smoke.json

  package:
    name: Build release archives
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build source and wheel
        run: |
          python -m pip install build
          python -m build
      - name: Verify release contents and installed wheel
        run: |
          python - <<'PY'
          import glob
          import tarfile
          import zipfile

          with tarfile.open(glob.glob("dist/*.tar.gz")[0]) as archive:
              names = archive.getnames()
          for suffix in ("/benchmark.md", "/benchmarks/massive/results.json", "/LICENSE", "/NOTICE", "/RELEASING.md"):
              assert any(name.endswith(suffix) for name in names), suffix
          with zipfile.ZipFile(glob.glob("dist/*.whl")[0]) as archive:
              assert "zet/ui/static/index.html" in archive.namelist()
          PY
          python -m pip install dist/*.whl
          cd /tmp
          python -c "import zet; print(zet.__version__)"
          zet --help
