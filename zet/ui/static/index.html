<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zet</title>
<style>
:root {
  --paper: #EEF1F4; --surface: #FFFFFF; --ink: #1D2A33; --muted: #5E6B75; --faint: #8A959E;
  --rule: #D5DCE2; --rule-soft: #E6EAEE;
  --sure: #1F7A5A; --sure-soft: #E2F0EA; --unsure: #A8660A; --unsure-soft: #F6EBDA;
  --error: #B3261E; --error-soft: #F8E4E2; --focus: #2F5D8A; --track: #E4E8EC;
  --display: "Bahnschrift", "DIN Alternate", "Barlow", "Segoe UI", system-ui, sans-serif;
  --text: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --r-sm: 4px; --r-md: 8px;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; }
body { font: 15px/1.5 var(--text); color: var(--ink); background: var(--paper); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
a { color: var(--focus); }
.num, table td.n, .pct { font-family: var(--display); font-variant-numeric: tabular-nums; }

/* ---------- frame ---------- */
.app { display: grid; grid-template-columns: 236px 1fr; min-height: 100%; background: linear-gradient(90deg, var(--ink) 236px, transparent 236px); }
.side { background: var(--ink); color: #E8EDF1; display: flex; flex-direction: column; padding: 20px 14px; gap: 18px;
        position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.brand { font: 600 26px/1 var(--display); letter-spacing: .02em; padding: 0 8px; }
.brand small { display: block; font: 400 12px/1.4 var(--text); color: #9FB0BC; letter-spacing: 0; margin-top: 6px; }
.side h2 { font: 500 13px/1 var(--text); color: #9FB0BC; margin: 0 8px 6px; }
.tasklist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; overflow: auto; }
.tasklist a { display: flex; align-items: center; gap: 9px; padding: 7px 8px; border-radius: var(--r-sm); color: inherit; text-decoration: none; }
.tasklist a:hover { background: #2A3A45; }
.tasklist a.on { background: #34495A; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: #6D7C87; }
.dot.ok { background: #4CC08E; } .dot.warn { background: #E5A33B; }
.tasklist .count { margin-left: auto; font: 500 12px/1 var(--display); background: #E5A33B; color: var(--ink); padding: 3px 6px; border-radius: 10px; }
.side .grow { flex: 1; }
.side .link { color: #C9D4DC; text-decoration: none; padding: 7px 8px; border-radius: var(--r-sm); display: block; }
.side .link:hover, .side .link.on { background: #2A3A45; color: #fff; }
.side .where { font-size: 12px; color: #8497A4; padding: 0 8px; word-break: break-all; }
.btn-new { background: transparent; border: 1px dashed #5C707E; color: #E8EDF1; border-radius: var(--r-sm); padding: 7px 8px; text-align: left; cursor: pointer; }
.btn-new:hover { border-color: #9FB0BC; }

main { padding: 28px 40px 80px; min-width: 0; }
.wrap { max-width: 1060px; }
h1 { font: 600 30px/1.15 var(--display); margin: 0 0 8px; letter-spacing: .01em; }
h2.sec { font: 600 19px/1.3 var(--display); margin: 34px 0 10px; }
h3 { font: 600 15px/1.4 var(--text); margin: 0 0 6px; }
p.lead { color: var(--muted); margin: 0 0 18px; max-width: 70ch; }
.muted { color: var(--muted); } .faint { color: var(--faint); } .small { font-size: 13px; }

/* status pills */
.pills { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
.pill { font-size: 13px; padding: 3px 10px; border-radius: 20px; background: var(--rule-soft); color: var(--muted); }
.pill.ok { background: var(--sure-soft); color: var(--sure); }
.pill.warn { background: var(--unsure-soft); color: var(--unsure); }
.pill.bad { background: var(--error-soft); color: var(--error); }

/* tabs */
.tabs { display: flex; gap: 26px; border-bottom: 1px solid var(--rule); margin-bottom: 26px; overflow-x: auto; white-space: nowrap; scrollbar-width: none; }
.tabs a { padding: 8px 0 11px; color: var(--muted); text-decoration: none; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs a:hover { color: var(--ink); }
.tabs a.on { color: var(--ink); border-bottom-color: var(--ink); font-weight: 600; }
.tabs .badge { font: 500 12px/1 var(--display); background: var(--unsure); color: #fff; padding: 2px 6px; border-radius: 9px; margin-left: 5px; }

/* controls */
.btn { border: 1px solid var(--rule); background: var(--surface); padding: 8px 14px; border-radius: var(--r-sm); cursor: pointer; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--ink); border-color: var(--ink); color: #fff; }
.btn.primary:hover { background: #2E3F4B; }
.btn:disabled { opacity: .5; cursor: default; }
.btn.small { padding: 4px 10px; font-size: 13px; }
.btn.quiet { border-color: transparent; background: transparent; color: var(--focus); padding-left: 0; padding-right: 0; }
input[type=text], input[type=number], select, textarea { border: 1px solid var(--rule); background: var(--surface); border-radius: var(--r-sm); padding: 8px 10px; }
textarea { width: 100%; resize: vertical; min-height: 110px; line-height: 1.5; }
label.field { display: flex; flex-direction: column; gap: 5px; font-size: 13px; color: var(--muted); }
label.field > span { color: var(--ink); font-size: 14px; }
label.field input, label.field select, label.field textarea { font-size: 15px; color: var(--ink); }
.row { display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap; }
.row.center { align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: var(--r-sm); overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: transparent; padding: 6px 12px; cursor: pointer; color: var(--muted); }
.seg button.on { background: var(--ink); color: #fff; }
details > summary { cursor: pointer; color: var(--focus); margin: 6px 0; }
.panel { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r-md); padding: 20px 22px; }
.stack > * + * { margin-top: 14px; }
.err { color: var(--error); background: var(--error-soft); padding: 10px 12px; border-radius: var(--r-sm); white-space: pre-wrap; }
.note { background: var(--rule-soft); padding: 10px 12px; border-radius: var(--r-sm); color: var(--muted); }
.empty { padding: 36px 0; max-width: 60ch; }
.empty h3 { font: 600 20px/1.3 var(--display); }

/* progress */
.progress { height: 6px; background: var(--track); border-radius: 3px; overflow: hidden; margin-top: 8px; }
.progress > div { height: 100%; background: var(--ink); transition: width .3s; }
.progress.indet > div { width: 30% !important; animation: slide 1.2s infinite ease-in-out; }
@keyframes slide { from { margin-left: -30%; } to { margin-left: 100%; } }
@media (prefers-reduced-motion: reduce) { .progress.indet > div { animation: none; width: 100% !important; opacity: .4; } }

/* ---------- the answer (the one loud thing) ---------- */
.answers { display: grid; gap: 14px; }
.answer { background: var(--surface); border: 1px solid var(--rule); border-left: 5px solid var(--rule); border-radius: var(--r-md); padding: 16px 20px; }
.answer.sure { border-left-color: var(--sure); }
.answer.unsure { border-left-color: var(--unsure); }
.answer .top { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.answer .q { color: var(--muted); font-size: 13px; width: 100%; }
.answer .value { font: 600 24px/1.2 var(--display); }
.status { font: 600 13px/1 var(--text); padding: 5px 10px; border-radius: 20px; }
.status.sure { background: var(--sure); color: #fff; }
.status.unsure { background: var(--unsure); color: #fff; }
.tag { font-size: 12px; padding: 3px 8px; border-radius: 20px; border: 1px solid var(--unsure); color: var(--unsure); }
.bars { margin-top: 12px; display: grid; grid-template-columns: minmax(90px, max-content) 1fr 52px; gap: 5px 12px; align-items: center; }
.bars .lab { font-size: 14px; }
.bars .track { height: 10px; background: var(--track); border-radius: 5px; overflow: hidden; }
.bars .fill { height: 100%; background: #9AA7B1; border-radius: 5px; }
.bars .pct { font-size: 13px; text-align: right; color: var(--muted); }
.bars .out { opacity: .38; }
.answer.sure .is-answer .fill { background: var(--sure); }
.answer.unsure .is-answer .fill { background: var(--unsure); }
.answer .foot { margin-top: 12px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.warnings { margin: 10px 0 0; padding-left: 18px; color: var(--unsure); font-size: 13px; }

/* verdict chips */
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chip { border: 1px solid var(--rule); background: var(--surface); border-radius: 20px; padding: 5px 12px; cursor: pointer; font-size: 14px; }
.chip:hover { border-color: var(--muted); }
.chip.model { border-color: var(--ink); }
.chip.pick { background: var(--ink); color: #fff; border-color: var(--ink); }
.chip kbd { font: 500 11px/1 var(--display); color: var(--faint); margin-right: 5px; }
.chip.pick kbd { color: #B8C6D1; }

/* review */
.review { display: grid; grid-template-columns: 330px 1fr; gap: 22px; align-items: start; }
.qlist { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r-md); max-height: 72vh; overflow: auto; }
.qitem { padding: 11px 14px; border-bottom: 1px solid var(--rule-soft); cursor: pointer; }
.qitem:hover { background: #F6F8F9; }
.qitem.on { background: #E9EEF2; box-shadow: inset 3px 0 0 var(--ink); }
.qitem .txt { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-size: 14px; }
.qitem .meta { display: flex; gap: 6px; margin-top: 5px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.qitem .why { color: var(--unsure); }
.qitem .why.audit { color: var(--focus); }
.message { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r-md); padding: 16px 20px; white-space: pre-wrap; font-size: 16px; line-height: 1.55; max-width: 72ch; }
.vq { padding: 14px 0; border-bottom: 1px solid var(--rule-soft); }
.vq:last-child { border-bottom: 0; }
.kbdhelp { font-size: 12px; color: var(--faint); margin-top: 10px; }

/* tables */
table.data { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r-md); overflow: hidden; font-size: 14px; }
table.data th { text-align: left; font-weight: 600; font-size: 13px; color: var(--muted); padding: 9px 12px; border-bottom: 1px solid var(--rule); background: #F7F9FA; }
table.data td { padding: 9px 12px; border-bottom: 1px solid var(--rule-soft); vertical-align: top; }
table.data tr:last-child td { border-bottom: 0; }
table.data td.n, table.data th.n { text-align: right; }
table.data tr.total td { font-weight: 600; background: #F7F9FA; }
table.data tr.click { cursor: pointer; } table.data tr.click:hover td { background: #F6F8F9; }
.clip { max-width: 440px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.good { color: var(--sure); } .bad { color: var(--error); } .warnc { color: var(--unsure); }
.dist { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
.dist .mini { display: grid; grid-template-columns: max-content 1fr 34px; gap: 3px 8px; align-items: center; font-size: 13px; }
.dist .mini .track { height: 7px; }
.drop { border: 2px dashed var(--rule); border-radius: var(--r-md); padding: 26px; text-align: center; background: var(--surface); color: var(--muted); cursor: pointer; }
.drop.over { border-color: var(--focus); background: #EEF3F8; }
.pager { display: flex; gap: 10px; align-items: center; margin-top: 10px; font-size: 13px; color: var(--muted); }

/* builder */
.qcard { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r-md); padding: 16px 18px; }
.qcard + .qcard { margin-top: 12px; }
.optrow { display: grid; grid-template-columns: 26px 170px 1fr 30px; gap: 8px; align-items: center; margin-top: 6px; }
.optrow .i { font: 500 13px/1 var(--display); color: var(--faint); text-align: right; }
.x { border: 0; background: transparent; cursor: pointer; color: var(--faint); font-size: 18px; line-height: 1; }
.x:hover { color: var(--error); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.toast { position: fixed; left: 256px; bottom: 20px; background: var(--ink); color: #fff; padding: 10px 16px; border-radius: var(--r-sm); font-size: 14px; opacity: 0; transform: translateY(8px); transition: .2s; pointer-events: none; }
.toast.show { opacity: 1; transform: none; }
.toast.error { background: var(--error); }

@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; background: none; }
  .side { position: static; height: auto; }
  main { padding: 20px 16px 60px; }
  .review { grid-template-columns: 1fr; }
  .tabs { gap: 18px; }
  .toast { left: 16px; }
  .optrow { grid-template-columns: 20px 1fr 30px; } .optrow .desc { grid-column: 2; }
}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side"></aside>
  <main><div class="wrap" id="view"></div></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
"use strict";
/* ============ helpers ============ */
// Empty slots (null, false, undefined) in append/replaceChildren are skipped instead of
// rendered as the text "null", so conditional children can be written inline everywhere.
for (const m of ["append", "replaceChildren"]) {
  const orig = Element.prototype[m];
  Element.prototype[m] = function (...kids) { return orig.apply(this, kids.flat(Infinity).filter(k => k != null && k !== false)); };
}
const $ = (s, el = document) => el.querySelector(s);
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "style") el.setAttribute("style", v);
    else if (k === "value") el.value = v;
    else if (v === true) el.setAttribute(k, "");
    else el.setAttribute(k, v);
  }
  for (const kid of kids.flat(Infinity)) {
    if (kid == null || kid === false) continue;
    el.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  }
  return el;
}
const pct = (x, d = 1) => x == null ? "–" : (100 * x).toFixed(d) + "%";
const fmtTime = s => { try { return new Date(s).toLocaleString(); } catch { return s; } };
function toast(msg, error = false) {
  const t = $("#toast"); t.textContent = msg; t.className = "toast show" + (error ? " error" : "");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.className = "toast", error ? 6000 : 2400);
}
async function api(method, path, body) {
  const opt = { method, headers: {} };
  if (method !== "GET") { opt.headers["X-Zet"] = "1"; opt.headers["Content-Type"] = "application/json"; opt.body = JSON.stringify(body || {}); }
  const r = await fetch(path, opt);
  const data = await r.json().catch(() => ({ error: "The Zet window stopped answering. Is it still running?" }));
  if (!r.ok || data.error) throw new Error(data.error || ("HTTP " + r.status));
  return data;
}
// run a background job; onUpdate(job) is called while it runs
async function runJob(path, body, onUpdate) {
  let job = await api("POST", path, body);
  while (job.status === "running") {
    onUpdate && onUpdate(job);
    await new Promise(r => setTimeout(r, 600));
    job = await api("GET", "/api/jobs/" + job.id);
  }
  if (job.status === "error") throw new Error(job.error);
  return job.result;
}
function progressEl() {
  const bar = h("div"), wrap = h("div", { class: "progress indet" }, bar), msg = h("div", { class: "small muted" });
  const el = h("div", { class: "stack" }, msg, wrap);
  el.update = job => {
    msg.textContent = job.message || "Working";
    if (job.progress && job.progress[1]) { wrap.classList.remove("indet"); bar.style.width = (100 * job.progress[0] / job.progress[1]) + "%"; }
    else wrap.classList.add("indet");
  };
  return el;
}
const errorBox = e => h("div", { class: "err", role: "alert" }, e.message || String(e));

/* question vocabulary: what a person reads instead of option keys */
function optionLabel(q, key) {
  if (q.type === "score") return q.criteria[+key] ?? key;
  if (q.type === "noul") return key === "true" ? "Yes" : "No";
  return key;
}
function optionKeys(q) {
  if (q.type === "score") return q.criteria.map((_, i) => String(i));
  if (q.type === "noul") return ["false", "true"];
  return Array.isArray(q.criteria) ? q.criteria.map(String) : Object.keys(q.criteria);
}
const typeName = t => ({ choice: "Choice", score: "Scale", noul: "Yes or no" })[t] || t;

/* ============ state and routing ============ */
const S = { state: null, detail: null };
function route() {
  const parts = location.hash.replace(/^#\/?/, "").split("/").map(decodeURIComponent);
  if (parts[0] === "t" && parts[1]) return { view: "task", task: parts[1], tab: parts[2] || "try", extra: parts[3] };
  if (parts[0] === "new") return { view: "new" };
  if (parts[0] === "tools") return { view: "tools" };
  return { view: "home" };
}
const go = hash => { if (location.hash === hash) render(); else location.hash = hash; };
window.addEventListener("hashchange", render);

async function refreshState() { S.state = await api("GET", "/api/state"); renderSide(); }

function renderSide() {
  const r = route(), st = S.state;
  const side = $("#side"); side.replaceChildren();
  side.append(h("div", { class: "brand" }, "Zet", h("small", {}, "Decisions that know when to ask")));
  const list = h("ul", { class: "tasklist" });
  for (const t of st.tasks) {
    const cls = t.drift || t.stale ? "warn" : t.version ? "ok" : "";
    list.append(h("li", {}, h("a", { href: "#/t/" + encodeURIComponent(t.name), class: r.task === t.name ? "on" : "",
        title: t.stale ? "Calibration out of date" : t.drift ? "Drift detected" : t.version ? "Calibrated" : "Not calibrated" },
      h("span", { class: "dot " + cls }), t.name, t.review ? h("span", { class: "count", title: "Waiting for review" }, t.review) : null)));
  }
  side.append(h("div", {}, h("h2", {}, "Tasks"), st.tasks.length ? list : h("div", { class: "where" }, "No tasks yet.")),
    h("button", { class: "btn-new", onclick: () => go("#/new") }, "+ New task"),
    h("div", { class: "grow" }),
    h("a", { href: "#/tools", class: "link" + (r.view === "tools" ? " on" : "") }, "Model check and benchmark"),
    h("div", { class: "where", title: "Where tasks are saved" }, "Saved in " + st.root));
}

async function render() {
  // Each navigation draws into its own container. If the person navigates again while this one
  // is still loading, the container is detached, so a late-finishing page can never stack on top.
  const r = route(), view = $("#view"), box = h("div");
  view.replaceChildren(box);
  try {
    if (!S.state) await refreshState(); else renderSide();
    if (r.view === "new") return box.append(newTaskView());
    if (r.view === "tools") return box.append(toolsView());
    if (r.view === "task") return await taskView(box, r);
    return box.append(homeView());
  } catch (e) { box.replaceChildren(errorBox(e)); }
}

/* ============ home ============ */
function homeView() {
  const st = S.state;
  if (!st.tasks.length) return h("div", { class: "empty" },
    h("h1", {}, "Teach Zet a decision"),
    h("p", { class: "lead" }, "A task is one set of questions you want answered about incoming text, such as which department an email goes to and how urgent it is. Zet answers them, and marks each answer sure or needs review, so only uncertain cases reach a person."),
    h("div", { class: "row" }, h("button", { class: "btn primary", onclick: () => go("#/new") }, "Create a task"),
      h("button", { class: "btn", onclick: () => { S.template = "support"; go("#/new"); } }, "Start from the support-email example")));
  return h("div", {}, h("h1", {}, "Tasks"), h("p", { class: "lead" }, "Choose a task on the left, or create a new one."),
    h("table", { class: "data" }, h("thead", {}, h("tr", {}, h("th", {}, "Task"), h("th", {}, "Status"), h("th", { class: "n" }, "Examples"), h("th", { class: "n" }, "Decisions"), h("th", { class: "n" }, "To review"))),
      h("tbody", {}, st.tasks.map(t => h("tr", { class: "click", onclick: () => go("#/t/" + encodeURIComponent(t.name)) },
        h("td", {}, t.name), h("td", {}, statusText(t)), h("td", { class: "n" }, t.examples), h("td", { class: "n" }, t.predictions), h("td", { class: "n" }, t.review || ""))))));
}
const statusText = t => t.stale ? "Out of date: recalibrate" : t.drift ? "Drift: recalibrate" : t.version ? "Calibrated, version " + t.version : "Not calibrated";

/* ============ task frame ============ */
const TABS = [["try", "Try"], ["review", "Review"], ["examples", "Examples"], ["calibration", "Calibration"], ["settings", "Settings"]];
async function taskView(view, r) {
  const d = S.detail = await api("GET", "/api/tasks/" + encodeURIComponent(r.task));
  const pills = h("div", { class: "pills" });
  if (d.stale) pills.append(h("span", { class: "pill bad" }, "Calibration out of date"));
  else if (d.version) pills.append(h("span", { class: "pill ok" }, "Calibrated, version " + d.version),
    h("span", { class: "pill" }, "Error budget " + pct(d.error_budget, 0)));
  else pills.append(h("span", { class: "pill warn" }, "Not calibrated: every answer needs review"));
  if (d.drift) pills.append(h("span", { class: "pill warn" }, "Drift detected"));
  pills.append(h("span", { class: "pill" }, backendText(d.backend)));
  const tabs = h("nav", { class: "tabs", "aria-label": "Task sections" }, TABS.map(([k, name]) =>
    h("a", { href: `#/t/${encodeURIComponent(d.name)}/${k}`, class: r.tab === k ? "on" : "", "aria-current": r.tab === k ? "page" : null },
      name, k === "review" && d.review ? h("span", { class: "badge" }, d.review) : k === "examples" ? h("span", { class: "faint" }, " " + d.examples) : null)));
  const body = h("div");

function parseSimpleYaml(text) {
  const lines = text.replace(/\t/g, "  ").split(/\r?\n/).filter(l => l.trim() && !l.trim().startsWith("#"));
  let i = 0;
  const scalar = s => { s = s.trim(); if (/^'.*'$/.test(s)) return s.slice(1, -1).replace(/''/g, "'"); if (/^".*"$/.test(s)) return JSON.parse(s); if (s === "null" || s === "~") return null; return s; };
  function block(indent) {
    if (i < lines.length && lines[i].trim().startsWith("- ")) {
      const arr = []; while (i < lines.length && lines[i].search(/\S/) === indent && lines[i].trim().startsWith("- ")) { arr.push(scalar(lines[i].trim().slice(2))); i++; } return arr;
    }
    const obj = {};
    while (i < lines.length) {
      const ind = lines[i].search(/\S/); if (ind < indent) break;
      const m = lines[i].trim().match(/^([^:]+):\s*(.*)$/); if (!m) throw new Error("line " + (i + 1));
      i++;
      if (m[2] === "") obj[scalar(m[1])] = i < lines.length && lines[i].search(/\S/) >= ind && (lines[i].search(/\S/) > ind || lines[i].trim().startsWith("- ")) ? block(lines[i].search(/\S/)) : null;
      else obj[scalar(m[1])] = scalar(m[2]);
    }
    return obj;
  }
  return block(0);
}

/* ============ Tools ============ */
function toolsView() {
  const el = h("div");
  const mp = modelPicker({ name: "laya-onnx", options: { model: "multilingual" } });
  const out = h("div"), run = h("button", { class: "btn primary" }, "Check the model");
  run.onclick = async () => {
    run.disabled = true; const prog = progressEl(); out.replaceChildren(prog);
    const v = mp.value();
    try {
      const r = await runJob("/api/tools/check-model", { model: v.options.model, english: v.options.english }, j => prog.update(j));
      out.replaceChildren(h("p", { class: r.torch_loaded ? "bad" : "good" }, r.torch_loaded ? "PyTorch was loaded. Zet should never need it: please report this." : `The model works without PyTorch: ${r.ms_per_decision} ms per answer on this computer.`),
        h("p", { class: "small muted" }, Object.entries(r.versions).map(([k, v]) => `${k} ${v}`).join(", ")),
        h("table", { class: "data" }, h("thead", {}, h("tr", {}, h("th", {}, "Message"), h("th", {}, "Language"), Object.keys(r.questions).map(q => h("th", {}, q)))),
          h("tbody", {}, r.results.map(x => h("tr", {}, h("td", {}, x.text), h("td", {}, x.language),
            Object.entries(r.questions).map(([q, qd]) => { const p = x.probs[q], k = Object.keys(p).reduce((a, b) => p[a] >= p[b] ? a : b); return h("td", {}, optionLabel(qd, k), h("span", { class: "faint" }, " " + pct(p[k], 0))); }))))),
        h("p", { class: "small muted" }, "These are raw model answers, before any calibration."));
    } catch (e) { out.replaceChildren(errorBox(e)); }
    run.disabled = false;
  };
  el.append(h("h1", {}, "Model check and benchmark"),
    h("h2", { class: "sec", style: "margin-top:12px" }, "Check the model"),
    h("p", { class: "muted" }, "Loads Laya on this computer and answers six English and Swedish test emails. The first run downloads the model, about 1.3 GB."),
    h("div", { class: "panel stack" }, mp, h("div", {}, run), out));
  // benchmark
  const LOCALES = [["en-US", "English"], ["sv-SE", "Swedish"], ["nb-NO", "Norwegian"], ["da-DK", "Danish"], ["de-DE", "German"], ["fr-FR", "French"], ["es-ES", "Spanish"], ["fi-FI", "Finnish"], ["ar-SA", "Arabic"], ["zh-CN", "Chinese"]];
  const checks = LOCALES.map(([c, n]) => h("label", { class: "row center", style: "gap:6px" }, h("input", { type: "checkbox", value: c, checked: c === "en-US" || c === "sv-SE" }), n));
  const per = h("input", { type: "number", value: "300", min: "50", max: "2000", step: "50", style: "width:100px" });
  const bOut = h("div"), bRun = h("button", { class: "btn primary" }, "Run the benchmark");
  bRun.onclick = async () => {
    const langs = checks.map(c => c.querySelector("input")).filter(i => i.checked).map(i => i.value);
    if (!langs.length) return toast("Choose at least one language", true);
    bRun.disabled = true; const prog = progressEl(); bOut.replaceChildren(prog);
    try {
      const r = await runJob("/api/tools/benchmark", { languages: langs, per_language: +per.value }, j => prog.update(j));
      bOut.replaceChildren(h("p", { class: "good" }, "Saved to " + r.saved_to + " (results.md and results.json)."),
        ...Object.entries(r.tasks).map(([name, t]) => h("div", {}, h("h3", { style: "margin-top:16px" }, `${t.options} scenarios`),
          h("table", { class: "data" }, h("thead", {}, h("tr", {}, h("th", {}, "Language"), h("th", { class: "n" }, "Tested"), h("th", { class: "n" }, "Right answer in list"), h("th", { class: "n" }, "Options left"), h("th", { class: "n" }, "Automated"), h("th", { class: "n" }, "Errors when sure"), h("th", { class: "n" }, "Error at most"))),
            h("tbody", {}, [...t.report.groups, t.report.overall].map(g => h("tr", { class: g.group === "all" ? "total" : "" }, h("td", {}, g.group === "all" ? "All" : g.group),
              h("td", { class: "n" }, g.n_test), h("td", { class: "n" }, pct(g.coverage)), h("td", { class: "n" }, g.avg_set_size == null ? "–" : g.avg_set_size.toFixed(2)), h("td", { class: "n" }, pct(g.automation)),
              h("td", { class: "n" }, g.n_sure ? `${g.sure_errors} of ${g.n_sure}` : "–"), h("td", { class: "n" }, pct(g.sure_error_upper)))))))));
    } catch (e) { bOut.replaceChildren(errorBox(e)); }
    bRun.disabled = false;
  };
  el.append(h("h2", { class: "sec" }, "MASSIVE benchmark"),
    h("p", { class: "muted" }, "Runs the same human-labeled voice-assistant requests in each language through Zet, with 18 and with 6 possible scenarios, and saves the results in the repository. Takes a few minutes per language on a normal computer."),
    S.state.benchmark ? h("div", { class: "panel stack" }, h("div", { class: "row", style: "gap:18px" }, checks),
      h("label", { class: "field" }, h("span", {}, "Messages per language"), per), h("div", {}, bRun), bOut)
      : h("p", { class: "note" }, "The benchmark needs a copy of the Zet repository; it is not part of an installed package."));
  return el;
}
